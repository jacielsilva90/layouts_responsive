  }
	return (
		<div>
		  <h1>Counters that update together</h1>
		  <MyButton count={count} onClick={handleClick} />
		  <MyButton count={count} onClick={handleClick} />
		</div>
	);

function MyButton4({ count, onClick }) {
	return (
		<button onClick={onClick}>Clicked {count} times</button>
